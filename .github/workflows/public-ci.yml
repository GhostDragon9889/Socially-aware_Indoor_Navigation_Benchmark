name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-check dependencies
        run: python -m pip install pytest==9.0.3 setuptools==81.0.0
      - name: Check standalone entry point
        run: python -m social_navigation status
      - name: Check layout without SDK
        run: >-
          python -m pytest --import-mode=importlib -p no:cacheprovider -q
          tests/test_project_layout.py
      - name: Verify complete upstream file mapping
        run: python scripts/verify_upstream_integration.py
      - name: Parse owned Python source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('src', 'scripts', 'tools', 'tests'):
              for path in Path(directory).rglob('*.py'):
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
