assumptions:
- Explicit motion-style improvement; retains high-level Diffusion plus low-level PPO/AMP,
  while state-only D follows public AMP/PACER instead of literal NavIsaacLab Eq2.
- Expert AMASS motions use2848 genuine nonoverlapping segments from1853 source
  trials with navigation labels. These are not the author's2848 unpublished
  original clip IDs. Original banks and heldout source identities are preserved.
- Native PhysX spherical joint velocities and public PACER use child-joint
  angular velocity. New expert velocities explicitly use that frame; legacy
  parent-local bank velocities are rotated on heldout loading, with provenance.
- Raw policy-history replay with65536 capacity, historical mixture0.5 and keep probability0.01
  after initial fill; complete buffer and Torch RNG are checkpointed.
- Discriminator takes2 balanced gradient steps per rollout independently of PPO; no
  repeated6-step full-batch coupling.
- Public normalizer means/variances transfer unchanged, but initial counts are explicitly
  capped at200000 to adapt to the current body/corpus/task distribution.
- Style weight2/task weight0.5 is an explicit experiment; published NavIsaacLab style
  weight1 remains available in the original profile.
- Policy likelihood, entropy, bounds and mirror loss use57 physically effective coordinates;
  inactive actions stay zero in physical control.
- Target KL0.02 guards subsequent actor updates; accepted PPO epochs/minibatches and
  independent D updates are measured.
- Mirrored policy consistency follows public PACER with gradients through both branches
  and loss scale50; MSE is over57 effective coordinates rather than69.
- Procedural0-2m/s commands and acceleration1.5m/s2 are selected explicitly viaCLI;
  they do not clip physical state or depend on Diffusion during training.
- BCE/softplus matches public PACER, not originalAMP least-squares. These changes
  require heldout style/contact/tracking/fall evaluation; higherDreward alone is not
  convergence.
