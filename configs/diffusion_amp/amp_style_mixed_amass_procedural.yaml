assumptions:
- >-
  Engineering fixed-slot mixed command curriculum, not the unpublished NavIsaacLab
  command dataset and not a context-conditioned discriminator or CMP reproduction.
  First half of the isolated actor slots uses real AMASS root XY, second half uses
  the original negative-baseline smooth procedural2m/s and1.5m/s2 commands.
  Every control step contributes exactly half its transitions to each group;
  differing reset frequency cannot silently redistribute exposure.
- >-
  All canonical TrainingConfig fields and uniform expert sampling match the
  negative-sign baseline. No branch ID, future3D reference pose, reference joint
  target or motion ID enters the actor. Both groups share one actor and AMP prior.
- >-
  AMASS reset history10/future31 uses a private CPU generator seeded seed+1 and
  shares the immutable bank. Procedural resets and experts retain the original
  corpus stream. These grouped draws do not reproduce the old fullbatch RNG
  sequence. All streams and fixed assignments are preserved in complete resume.
- >-
  AMASS real-prefix commands use native30Hz source XY plus a fixed episode world
  translation. Only clip-outside future commands use the declared linear endpoint
  velocity estimate. This continuation is not AMASS groundtruth. Real-source end
  truncates only AMASS slots; procedural slots retain falls and300-step cap.
- >-
  AMASS consumed plans use151 native30Hz knots; procedural canonical51 knots keep
  their original10Hz interpolation for rewards and future task targets. Replans
  retain procedural live-root anchors. No physical state is changed by commands.
- >-
  Fresh2000updates with256actors and32rolloutsteps gives16.384M total transitions,
  exactly8.192M per group. Total budget is twice the older1000update runs, so the
  comparison is not a matched-total-budget causal proof of mixing alone.
- >-
  Fresh training uses the same public PACER actor/critic/state-only discriminator
  transfer initialization. An old single-source checkpoint is not a valid mixed
  resume. Source/reset/clipend clocks and RNG require the exact mixed schema.
