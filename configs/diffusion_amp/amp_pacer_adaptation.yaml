assumptions:
- Explicit method improvement/ablation; state-only discriminator differs from NavIsaacLab
  Eq2 D(h,a).
- Published PACER source and checkpoint use a state-only ten-frame discriminator despite
  action-conditioned notation in its paper.
- Transfer complete published actor, critic, task encoder, sigma, observation/value
  moments, state-only discriminator, and history-coordinate moments.
- AMP consumes states only; inverse-next-pose expert PD proxies may still be provided
  by the runner but are not inputs to this discriminator.
- Public PACER BCE and softplus reward mapping retained; not original AMP least-squares
  objective.
- Inherited public observation/value/discriminator moment counts are preserved, so
  their statistics adapt very slowly; no hidden count reset.
- Replay, whole-joint dropout, mirror symmetry regularization, original terrain curriculum
  and motion manifest are not reproduced by this ablation.
- Current time-aligned signed projected effort and direction reward follow the declared
  reconstruction contract; public PACER absolute power and task/style weights differ.
- Derived AMASS corpus, modern IsaacSim6/Lab3 physics and planner differ from the
  author experiment; no exact-author claim.
evaluation:
  requested_paper_scenes: 8
  pedestrians_per_scene:
  - 3
  - 15
  duration_seconds_per_scene: 200
  author_scene_manifest: null
  paper_exact_metrics_claim: false
  low_level_diagnostic: isolated analytic straight trajectory on sufficiently large
    floor; no diffusion or author-benchmark claim
profile: public_pacer_state_only_adaptation_ablation
