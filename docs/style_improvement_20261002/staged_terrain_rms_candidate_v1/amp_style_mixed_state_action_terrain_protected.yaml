assumptions:
- Engineering fixed-slot mixed command curriculum, not the unpublished NavIsaacLab
  command dataset and not a context-conditioned discriminator or CMP reproduction.
  First half of the isolated actor slots uses real AMASS root XY, second half uses
  the original negative-baseline smooth procedural2m/s and1.5m/s2 commands. Every
  control step contributes exactly half its transitions to each group; differing reset
  frequency cannot silently redistribute exposure.
- All PPO, PD, reward, replay, expert sampling, data and mixed command settings retain
  the fixed-half negative-direction baseline. Only the discriminator input and initialization
  change. The actor receives no branch ID or future reference3D poses.
- AMASS reset history10/future31 uses a private CPU generator seeded seed+1 and shares
  the immutable bank. Procedural resets and experts retain the original corpus stream.
  These grouped draws do not reproduce the old fullbatch RNG sequence. All streams
  and fixed assignments are preserved in complete resume.
- AMASS real-prefix commands use native30Hz source XY plus a fixed episode world translation.
  Only clip-outside future commands use the declared linear endpoint velocity estimate.
  This continuation is not AMASS groundtruth. Real-source end truncates only AMASS
  slots; procedural slots retain falls and300-step cap.
- AMASS consumed plans use151 native30Hz knots; procedural canonical51 knots keep
  their original10Hz interpolation for rewards and future task targets. Replans retain
  procedural live-root anchors. No physical state is changed by commands.
- Fresh2000updates with256actors and32rolloutsteps gives16.384M total transitions,
  exactly8.192M per group. Total budget is twice the older1000update runs, so the
  comparison is not a matched-total-budget causal proof of mixing alone.
- Fresh training transfers the same complete public PACER actor/critic/task, Gaussian
  sigma and observation/value moments. The2019-input history+action discriminator
  and its1950 history-coordinate RMS begin independently; the public1950 state-only
  discriminator and AMP moments are not transferred. An existing state-only mixed
  checkpoint is not valid resume.
- NavIsaacLab Eq2 prints a history-and-action discriminator. This profile matches
  that input form, while keeping the engineering10-frame newest-first convention and
  the existing negative-direction reward and2.0 AMP weight. It is not a paper-exact
  profile.
- AMASS supplies no measured expert commands. Expert actions are next-frame mocap
  joint positions divided by the existing physical PD scale, clamped and with the12
  frozen hand/toe coordinates zero. This is a normalized PD target proxy, not expert
  torque or inverse dynamics.
- AMP normalization remains per_history_coordinate with1950 entries to avoid a further
  change to the normalization representation. Initial history mean0/variance1/count0
  are not public transferred statistics; action coordinates are already normalized
  and receive no learned action RMS.
- The seed7 recipe and complete RNG checkpointing are retained. The extra69 discriminator
  inputs change the constructor random draw budget, so this profile does not promise
  bitwise paired stochastic draws across discriminator variants.
- 'Staged terrain RMS suffix protection: only task20:1044 mean/variance preserved
  at exact public initial statistics; trajectory20 and shared task count retain original
  updates. The reference count remains separate immutable provenance, not the incrementing
  global counter. Current production runner rejects the new field until explicit integration;
  no trained result is claimed.'
