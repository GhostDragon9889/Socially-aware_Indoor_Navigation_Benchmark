assumptions:
- >-
  Single opt-in command curriculum experiment relative to amp_style_amass_backward_penalty.yaml.
  Every canonical TrainingConfig value and the disabled expert sampler are unchanged.
  Commands, legal reset phase bounds and actual clip-end truncation change explicitly.
- >-
  Within the real clip, future targets use exact source root XY from the same clip and phase
  as the initial mocap reset, translated once into the reset world. Replanning never
  anchors the command to the live physical root, so lag is not silently erased.
- >-
  All2848 genuine v7 segments remain eligible; these are not the unpublished author
  motion IDs. Reset reserves10 real history frames and31 real subsequent30Hz steps.
  Five-second command windows explicitly extrapolate only beyond the source using
  v=(root[-1]-root[-11])/(10/30), eleven real positions and ten intervals.
  This future is not AMASS groundtruth. Beyond-source/held/extrapolated knots are
  counted separately, and episodes truncate at the last real source frame.
- >-
  This is an engineering lower-level training curriculum, not a claim that NavIsaacLab
  or public PACER used AMASS root trajectories to generate training commands.
  Actor input contains physical self-state, terrain and futureXY only. Future3D
  poses, source identities, reference joint targets and velocities never enter it.
- >-
  Ground physics, PD actions, AMP history/style reward, discriminator sampling,
  normalizers and PPO parameters retain the negative-sign baseline. Deployment
  remains learned Diffusion; no AMASS future data is used for navigation evaluation.
- >-
  Source-tail time limits bootstrap the actual final physical observation before
  reset, preserving the existing PPO truncated-transition semantics. This is not
  reference tracking success or physical bitwise resume; solver caches are unsaved.
evaluation:
  requested_paper_scenes: 8
  author_scene_manifest: null
  paper_exact_metrics_claim: false
  deployment_source: diffusion
profile: amass_root_xy_command_curriculum
trajectory_training:
