  minimum_real_future_frames: 31
  history_frames: 10
  horizon_s: 5.0
  canonical_knot_hz: 10
  consumed_reference_hz: 30
  control_hz: 30
  world_translation: fixed_once_at_episode_reset
  tail_policy: linear_velocity
  end_velocity_formula: (root_xy[-1]-root_xy[-11])/(10/30)
  extrapolated_future_is_amass_groundtruth: false
  episode_end: actual_clip_last_frame_or_existing_physical_fall_or_cap
  future_3d_poses_in_policy: false
