assumptions:
- Engineering fixed-slot mixed command curriculum, not the unpublished NavIsaacLab command dataset and not
  a context-conditioned discriminator or CMP reproduction. First half of the isolated actor slots uses real
  AMASS root XY, second half uses the original negative-baseline smooth procedural2m/s and1.5m/s2 commands.
  Every control step contributes exactly half its transitions to each group; differing reset frequency cannot
  silently redistribute exposure.
- Relative to completed19f state-prior weight2 fresh2000 control, only training.expert_sampling changes. Public
  actor/critic/state-prior discriminator/history RMS, PPO, PD, task/reward weights, replay, fixed-half AMASS/procedural
  commands and protected terrain statistics remain identical. The2848 registry and train/validation/test parent
  separation are unchanged.
- AMASS reset history10/future31 uses a private CPU generator seeded seed+1 and shares the immutable bank.
  Procedural resets and experts retain the original corpus stream. These grouped draws do not reproduce the
  old fullbatch RNG sequence. All streams and fixed assignments are preserved in complete resume.
- AMASS real-prefix commands use native30Hz source XY plus a fixed episode world translation. Only clip-outside
  future commands use the declared linear endpoint velocity estimate. This continuation is not AMASS groundtruth.
  Real-source end truncates only AMASS slots; procedural slots retain falls and300-step cap.
- AMASS consumed plans use151 native30Hz knots; procedural canonical51 knots keep their original10Hz interpolation
  for rewards and future task targets. Replans retain procedural live-root anchors. No physical state is changed
  by commands.
- Fresh2000updates with256actors and32rolloutsteps gives16.384M total transitions, exactly8.192M per group.
  Total budget is twice the older1000update runs, so the comparison is not a matched-total-budget causal proof
  of mixing alone.
- Fresh training transfers the same public PACER actor/critic/task, Gaussian sigma and observation/value moments.
  The2019-input discriminator copies the public1950 state-history columns, biases, middle layer and head, with69
  new action columns initialized to zero. Its1950 history-coordinate mean/variance/count are transferred together
  with D and use the existing count cap200000. All discriminator parameters remain trainable after initialization.
- NavIsaacLab Eq2 prints a history-and-action discriminator. This profile matches that input form, while keeping
  the engineering10-frame newest-first convention and the existing negative-direction reward and2.0 AMP weight.
  It is not a paper-exact profile.
- AMASS supplies no measured expert commands. Expert actions are next-frame mocap joint positions divided by
  the existing physical PD scale, clamped and with the12 frozen hand/toe coordinates zero. This is a normalized
  PD target proxy, not expert torque or inverse dynamics.
- AMP normalization remains per_history_coordinate with1950 entries. This fresh initialization copies public
  AMP history mean/variance and records public count15482880001 before the existing count cap200000; action
  coordinates retain their existing normalized action convention and receive no learned action RMS.
- The seed7 recipe and complete RNG checkpointing are retained. The extra69 discriminator inputs change the
  constructor random draw budget, so this profile does not promise bitwise paired stochastic draws across discriminator
  variants.
- 'Independent fresh engineering ablation: preserve the exact public PACER terrain mean/variance at task[20:1044]
  after each existing observation-statistics update; task[0:20] and the shared global task count retain the
  original moment-update math. The independent original reference_count61931520001 and warm-start task-count
  cap200000 are saved separately. This does not convert any old model, change discriminator/replay/expert actions,
  or establish a paper-exact method or quality gain. Fresh complete public actor/critic warm start is required;
  from-scratch is rejected.'
- 'Local engineering expert prior: low_speed.10/fast.05/sideways.10/turning.25/moving.50; sqrt(dataset parent
  support), then uniform parent and uniform legal history10/future1 center. Kinematic window proxies are not
  author style labels. No p/q importance correction is applied. A private CPU generator uses seed7. Each expert
  call still makes one discarded actual legacy corpus call, preserving shared reset RNG only for matched call
  schedules. Full resume must retain both private sampler and shared corpus RNG states; changed falls/reset
  schedules can diverge.'
